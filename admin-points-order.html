<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分订单管理</title>
    <link rel="stylesheet" href="./static/index.css">
    <script src="./static/vue.js"></script>
    <script src="./static/index.js"></script>
    <script src="./static/axios.min.js"></script>
    <link rel="stylesheet" href="./static/back.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .subtitle {
            color: #666;
            margin-top: 5px;
            font-size: 14px;
        }
        
        .orders-table {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .table-header {
            padding: 15px 20px;
            border-bottom: 1px solid #ebeef5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .table-title {
            font-size: 16px;
            font-weight: 500;
        }
        
        .table-container {
            padding: 20px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-pending {
            background-color: #fdf6ec;
            color: #e6a23c;
            border: 1px solid #faecd8;
        }
        
        .status-processing {
            background-color: #ecf5ff;
            color: #409EFF;
            border: 1px solid #d9ecff;
        }
        
        .status-shipped {
            background-color: #f0f9eb;
            color: #67c23a;
            border: 1px solid #e1f3d8;
        }
        
        .points-badge {
            display: inline-block;
            padding: 2px 6px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .pagination-container {
            padding: 20px;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: center;
        }
        
        .action-button {
            margin-left: 10px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
        
        .order-info {
            line-height: 1.5;
        }
        
        .order-time {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="admin-nav-container">
            <div class="admin-logo">
                <i class="fas fa-print"></i>
                <span>诚荟印后台管理</span>
            </div>
            
            <ul class="admin-nav-links">
                <li><a href="./admin_orders.html"><i class="fas fa-clipboard-list"></i> 订单管理</a></li>
                <li><a href="./admin_user.html"><i class="fas fa-users"></i> 用户管理</a></li>
                <li><a href="./admin_data.html"><i class="fas fa-chart-line"></i> 数据统计</a></li>
                <li><a href="./admin_config.html"><i class="fas fa-cog"></i> 系统设置</a></li>
                <li><a href="./admin-points-mall.html"><i class="fas fa-cog"></i> 积分商城</a></li>
                <li><a href="./admin-points-order.html" class="active"><i class="fas fa-clipboard-list"></i> 积分订单</a></li>
            </ul>
            
            <div class="admin-user-info">
                <div class="admin-user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <div style="font-weight: 500;">管理员</div>
                    <div style="font-size: 0.85rem; opacity: 0.8;">admin@print.com</div>
                </div>
            </div>
        </div>
    </header>
    <div id="app" class="container" style="margin-top: 20px;">
        <!-- 页面标题 -->
        <div class="header">
            <h1 class="title">积分订单管理</h1>
            <p class="subtitle">管理用户积分兑换的订单</p>
        </div>
        
        <!-- 订单表格 -->
        <div class="orders-table">
            <div class="table-header">
                <div class="table-title">订单列表</div>
                <div>
                    共 {{ total }} 条订单
                </div>
            </div>
            
            <div class="table-container">
                <!-- 加载中 -->
                <div v-if="loading" class="loading">
                    <i class="el-icon-loading" style="font-size: 20px;"></i>
                    <p>加载中...</p>
                </div>
                
                <!-- 无数据 -->
                <div v-else-if="orders.length === 0" class="no-data">
                    <i class="el-icon-tickets" style="font-size: 48px; margin-bottom: 10px;"></i>
                    <p>暂无订单数据</p>
                </div>
                
                <!-- 订单表格 -->
                <el-table v-else :data="orders" style="width: 100%;">
                    <el-table-column prop="order_number" label="订单号" width="160">
                        <template slot-scope="scope">
                            <div style="font-weight: 500; color: #409EFF;">
                                {{ scope.row.order_number }}
                            </div>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="product_name" label="商品信息" min-width="180">
                        <template slot-scope="scope">
                            <div class="order-info">
                                <div style="font-weight: 500;">{{ scope.row.product_name }}</div>
                                <div style="color: #666; font-size: 13px;">
                                    数量：{{ scope.row.quantity }}
                                </div>
                            </div>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="points_used" label="积分" width="100" align="center">
                        <template slot-scope="scope">
                            <span class="points-badge">{{ scope.row.points_used }}</span>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="shipping_name" label="收货人" width="120">
                        <template slot-scope="scope">
                            <div style="font-weight: 500;">{{ scope.row.shipping_name }}</div>
                            <div style="color: #666; font-size: 12px;">{{ scope.row.shipping_phone }}</div>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="status" label="状态" width="100" align="center">
                        <template slot-scope="scope">
                            <span :class="['status-badge', 'status-' + scope.row.status]">
                                {{ getStatusText(scope.row.status) }}
                            </span>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="created_at" label="下单时间" width="160">
                        <template slot-scope="scope">
                            {{ formatDate(scope.row.created_at) }}
                        </template>
                    </el-table-column>
                    
                    <el-table-column label="操作" width="100" fixed="right" align="center">
                        <template slot-scope="scope">
                            <el-button
                                v-if="scope.row.status === 'pending' || scope.row.status === 'processing'"
                                type="primary"
                                size="small"
                                @click="shipOrder(scope.row)"
                            >
                                发货
                            </el-button>
                            <span v-else style="color: #999;">已发货</span>
                        </template>
                    </el-table-column>
                </el-table>
            </div>
            
            <!-- 分页 -->
            <div v-if="total > 0" class="pagination-container">
                <el-pagination
                    @size-change="handleSizeChange"
                    @current-change="handleCurrentChange"
                    :current-page="currentPage"
                    :page-sizes="[20, 50, 100]"
                    :page-size="pageSize"
                    layout="total, sizes, prev, pager, next"
                    :total="total"
                >
                </el-pagination>
            </div>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    // 订单数据
                    orders: [],
                    loading: false,
                    currentPage: 1,
                    pageSize: 20,
                    total: 0
                };
            },
            mounted() {
                this.loadOrders();
            },
            methods: {
                // 格式化日期
                formatDate(date) {
                    if (!date) return '';
                    const d = new Date(date);
                    return d.toLocaleDateString('zh-CN');
                },
                
                // 获取状态文本
                getStatusText(status) {
                    const statusMap = {
                        'pending': '待处理',
                        'processing': '处理中',
                        'shipped': '已发货',
                        'completed': '已完成',
                        'cancelled': '已取消'
                    };
                    return statusMap[status] || status;
                },
                
                // 加载订单列表
                async loadOrders() {
                    this.loading = true;
                    try {
                        const params = {
                            page: this.currentPage,
                            page_size: this.pageSize
                        };
                        
                        const response = await axios.get('http://43.143.87.196:8070/api/admin/points/orders/list', { params });
                        
                        if (response.data.success) {
                            this.orders = response.data.orders;
                            this.total = response.data.total;
                        } else {
                            this.$message.error(response.data.error || '加载订单失败');
                        }
                    } catch (error) {
                        console.error('加载订单失败:', error);
                        this.$message.error('网络错误');
                    } finally {
                        this.loading = false;
                    }
                },
                
                // 分页大小改变
                handleSizeChange(val) {
                    this.pageSize = val;
                    this.loadOrders();
                },
                
                // 页码改变
                handleCurrentChange(val) {
                    this.currentPage = val;
                    this.loadOrders();
                },
                
                // 发货订单
                shipOrder(order) {
                    this.$confirm(`确定要将订单 ${order.order_number} 标记为已发货吗？`, '确认发货', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        try {
                            const response = await axios.put(`http://43.143.87.196:8070/api/admin/points/order/${order.id}/ship`);
                            
                            if (response.data.success) {
                                this.$message.success('发货成功');
                                // 重新加载订单列表
                                this.loadOrders();
                            } else {
                                this.$message.error(response.data.error || '发货失败');
                            }
                        } catch (error) {
                            console.error('发货失败:', error);
                            this.$message.error('发货失败');
                        }
                    }).catch(() => {});
                }
            }
        });
    </script>
</body>
</html>
