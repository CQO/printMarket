<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分订单管理</title>
    <link rel="stylesheet" href="./static/index.css">
    <script src="./static/vue.js"></script>
    <script src="./static/index.js"></script>
    <script src="./static/axios.min.js"></script>
    <link rel="stylesheet" href="./static/back.css">
    <link rel="stylesheet" href="./static/admin-main.css">
    <script src="./static/admin-user.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .subtitle {
            color: #666;
            margin-top: 5px;
            font-size: 14px;
        }
        
        .orders-table {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .table-header {
            padding: 15px 20px;
            border-bottom: 1px solid #ebeef5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .table-title {
            font-size: 16px;
            font-weight: 500;
        }
        
        .table-container {
            padding: 20px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-pending {
            background-color: #fdf6ec;
            color: #e6a23c;
            border: 1px solid #faecd8;
        }
        
        .status-paid {
            background-color: #ecf5ff;
            color: #409EFF;
            border: 1px solid #d9ecff;
        }
        
        .status-shipped {
            background-color: #f0f9eb;
            color: #67c23a;
            border: 1px solid #e1f3d8;
        }

        
        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .pagination-container {
            padding: 20px;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: center;
        }
        
        .action-button {
            margin-left: 10px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
        
        .order-info {
            line-height: 1.5;
        }
        
        .order-time {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        
        /* 搜索栏样式 */
        .search-bar {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }
        
        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        
        .search-item {
            display: flex;
            flex-direction: column;
            min-width: 200px;
        }
        
        .search-label {
            font-size: 14px;
            color: #606266;
            margin-bottom: 5px;
        }
        
        .search-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        
        .date-range-picker {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .date-range-separator {
            color: #909399;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-item {
                min-width: 100%;
            }
            
            .search-actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="admin-nav-container">
            <div class="admin-logo">
                <i class="fas fa-print"></i>
                <span>诚荟印后台管理</span>
            </div>
            
            <ul class="admin-nav-links">
                <li><a href="./admin_orders.html"><i class="fas fa-clipboard-list"></i> 订单管理</a></li>
                <li id="yhgl" style="display: none;"><a href="./admin_user.html"><i class="fas fa-users"></i> 用户管理</a></li>
                <li id="sjtj" style="display: none;"><a href="./admin_data.html"><i class="fas fa-chart-line"></i> 数据统计</a></li>
                <li id="xtsz" style="display: none;"><a href="./admin_config.html"><i class="fas fa-cog"></i> 系统设置</a></li>
                <li><a href="./admin-points-mall.html"><i class="fas fa-cog"></i> 积分商城</a></li>
                <li><a href="./admin-points-order.html" class="active"><i class="fas fa-clipboard-list"></i> 积分订单</a></li>
            </ul>
            
            <div class="admin-user-info">
                <div class="admin-user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <div id="usernameShow" style="font-weight: 500;">管理员</div>
                </div>
            </div>
        </div>
    </header>
    <div id="app" class="container" style="margin-top: 20px;">
        <!-- 页面标题 -->
        <div class="header">
            <h1 class="title">积分订单管理</h1>
            <p class="subtitle">管理用户积分兑换的订单</p>
        </div>
        
        <!-- 搜索栏 -->
        <div class="search-bar">
            <div class="search-form">
                <div class="search-item">
                    <div class="search-label">订单号</div>
                    <el-input
                        v-model="searchParams.order_number"
                        placeholder="请输入订单号"
                        clearable
                        @clear="handleSearch"
                        @keyup.enter.native="handleSearch"
                    ></el-input>
                </div>
                
                <div class="search-item">
                    <div class="search-label">商品名称</div>
                    <el-input
                        v-model="searchParams.product_name"
                        placeholder="请输入商品名称"
                        clearable
                        @clear="handleSearch"
                        @keyup.enter.native="handleSearch"
                    ></el-input>
                </div>
                
                <div class="search-item">
                    <div class="search-label">收货人</div>
                    <el-input
                        v-model="searchParams.shipping_name"
                        placeholder="请输入收货人姓名"
                        clearable
                        @clear="handleSearch"
                        @keyup.enter.native="handleSearch"
                    ></el-input>
                </div>
                
                <div class="search-item">
                    <div class="search-label">订单状态</div>
                    <el-select
                        v-model="searchParams.status"
                        placeholder="请选择订单状态"
                        clearable
                        @change="handleSearch"
                    >
                        <el-option label="全部" value=""></el-option>
                        <el-option label="待发货" value="pending"></el-option>
                        <el-option label="待下载" value="paid"></el-option>
                        <el-option label="已发货" value="shipped"></el-option>
                        <el-option label="已完成" value="completed"></el-option>
                        <el-option label="已取消" value="cancelled"></el-option>
                    </el-select>
                </div>
                
                <div class="search-item">
                    <div class="search-label">下单时间</div>
                    <div class="date-range-picker">
                        <el-date-picker
                            v-model="searchParams.start_date"
                            type="date"
                            placeholder="开始日期"
                            value-format="yyyy-MM-dd"
                            @change="handleDateChange"
                            clearable
                        ></el-date-picker>
                        <span class="date-range-separator">至</span>
                        <el-date-picker
                            v-model="searchParams.end_date"
                            type="date"
                            placeholder="结束日期"
                            value-format="yyyy-MM-dd"
                            @change="handleDateChange"
                            clearable
                        ></el-date-picker>
                    </div>
                </div>
                
                <div class="search-actions">
                    <el-button type="primary" @click="handleSearch" icon="el-icon-search">搜索</el-button>
                    <el-button @click="handleReset" icon="el-icon-refresh">重置</el-button>
                    <!-- <el-button @click="exportOrders" icon="el-icon-download" type="success">导出</el-button> -->
                </div>
            </div>
        </div>
        
        <!-- 订单表格 -->
        <div class="orders-table">
            <div class="table-header">
                <div class="table-title">订单列表</div>
                <div>
                    共 {{ total }} 条订单
                </div>
            </div>
            
            <div class="table-container">
                <!-- 加载中 -->
                <div v-if="loading" class="loading">
                    <i class="el-icon-loading" style="font-size: 20px;"></i>
                    <p>加载中...</p>
                </div>
                
                <!-- 无数据 -->
                <div v-else-if="orders.length === 0" class="no-data">
                    <i class="el-icon-tickets" style="font-size: 48px; margin-bottom: 10px;"></i>
                    <p>暂无订单数据</p>
                </div>
                
                <!-- 订单表格 -->
                <el-table v-else :data="orders">
                    <el-table-column prop="order_number" label="订单号" width="210">
                        <template slot-scope="scope">
                            <div style="font-weight: 500; color: #409EFF;">
                                {{ scope.row.order_number }}
                            </div>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="product_name" label="商品信息">
                        <template slot-scope="scope">
                            <div class="order-info">
                                <div style="font-weight: 500;">{{ scope.row.product_name }}</div>
                                <div style="color: #666; font-size: 13px;">
                                    数量：{{ scope.row.quantity }}
                                </div>
                            </div>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="points_used" label="积分" width="100" align="center">
                        <template slot-scope="scope">
                            <span class="points-badge">{{ scope.row.points_used }}</span>
                        </template>
                    </el-table-column>

                    <el-table-column prop="points_used" label="金额" width="100" align="center">
                        <template slot-scope="scope">
                            <span class="points-badge">{{ scope.row.money_used }}</span>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="shipping_name" label="收货人" width="120">
                        <template slot-scope="scope">
                            <div style="font-weight: 500;">{{ scope.row.shipping_name }}</div>
                            <div style="color: #666; font-size: 12px;">{{ scope.row.shipping_phone }}</div>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="status" label="状态" width="100" align="center">
                        <template slot-scope="scope">
                            <span :class="['status-badge', 'status-' + scope.row.status]">
                                {{ getStatusText(scope.row.status) }}
                            </span>
                        </template>
                    </el-table-column>
                    
                    <el-table-column prop="created_at" label="下单时间" width="160">
                        <template slot-scope="scope">
                            {{ formatDateTime(scope.row.created_at) }}
                        </template>
                    </el-table-column>
                    
                    <el-table-column label="操作" width="100" fixed="right" align="center">
                        <template slot-scope="scope">
                            <el-button
                                v-if="scope.row.status === 'pending' || scope.row.status === 'paid'"
                                type="primary"
                                size="small"
                                @click="shipOrder(scope.row)"
                            >
                                发货
                            </el-button>
                            <span v-else style="color: #999;">已发货</span>
                        </template>
                    </el-table-column>
                </el-table>
            </div>
            
            <!-- 分页 -->
            <div v-if="total > 0" class="pagination-container">
                <el-pagination
                    @size-change="handleSizeChange"
                    @current-change="handleCurrentChange"
                    :current-page="currentPage"
                    :page-sizes="[20, 50, 100]"
                    :page-size="pageSize"
                    layout="total, sizes, prev, pager, next"
                    :total="total"
                >
                </el-pagination>
            </div>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    // 订单数据
                    orders: [],
                    loading: false,
                    currentPage: 1,
                    pageSize: 20,
                    total: 0,
                    
                    // 搜索参数
                    searchParams: {
                        order_number: '',
                        product_name: '',
                        shipping_name: '',
                        status: 'pending',
                        start_date: '',
                        end_date: ''
                    }
                };
            },
            mounted() {
                this.loadOrders();
            },
            methods: {
                // 格式化日期时间
                formatDateTime(date) {
                    if (!date) return '';
                    const d = new Date(date);
                    const year = d.getFullYear();
                    const month = (d.getMonth() + 1).toString().padStart(2, '0');
                    const day = d.getDate().toString().padStart(2, '0');
                    const hours = d.getHours().toString().padStart(2, '0');
                    const minutes = d.getMinutes().toString().padStart(2, '0');
                    return `${year}-${month}-${day} ${hours}:${minutes}`;
                },
                
                // 获取状态文本
                getStatusText(status) {
                    const statusMap = {
                        'pending': '待发货',
                        'paid': '已支付',
                        'shipped': '已发货',
                        'completed': '已完成',
                        'cancelled': '已取消'
                    };
                    return statusMap[status] || status;
                },
                
                // 处理日期选择
                handleDateChange() {
                    // 如果选择了结束日期但没有开始日期，自动设置开始日期为结束日期前30天
                    if (this.searchParams.end_date && !this.searchParams.start_date) {
                        const endDate = new Date(this.searchParams.end_date);
                        const startDate = new Date(endDate);
                        startDate.setDate(startDate.getDate() - 30);
                        this.searchParams.start_date = this.formatDate(startDate);
                    }
                    this.handleSearch();
                },
                
                // 格式化日期为YYYY-MM-DD
                formatDate(date) {
                    if (!date) return '';
                    const d = new Date(date);
                    const year = d.getFullYear();
                    const month = (d.getMonth() + 1).toString().padStart(2, '0');
                    const day = d.getDate().toString().padStart(2, '0');
                    return `${year}-${month}-${day}`;
                },
                
                // 加载订单列表
                async loadOrders() {
                    this.loading = true;
                    try {
                        const params = {
                            page: this.currentPage,
                            page_size: this.pageSize,
                            ...this.searchParams
                        };
                        
                        // 清理空参数
                        Object.keys(params).forEach(key => {
                            if (params[key] === '' || params[key] === null || params[key] === undefined) {
                                delete params[key];
                            }
                        });
                        
                        const response = await axios.get('https://ht.bbbyg.vip/api/admin/points/orders/list', { params });
                        
                        if (response.data.success) {
                            this.orders = response.data.orders;
                            this.total = response.data.total;
                        } else {
                            this.$message.error(response.data.error || '加载订单失败');
                        }
                    } catch (error) {
                        console.error('加载订单失败:', error);
                        this.$message.error('网络错误');
                    } finally {
                        this.loading = false;
                    }
                },
                
                // 搜索订单
                handleSearch() {
                    this.currentPage = 1; // 重置到第一页
                    this.loadOrders();
                },
                
                // 重置搜索条件
                handleReset() {
                    this.searchParams = {
                        order_number: '',
                        product_name: '',
                        shipping_name: '',
                        status: '',
                        start_date: '',
                        end_date: ''
                    };
                    this.currentPage = 1;
                    this.loadOrders();
                },
                
                // 导出订单
                exportOrders() {
                    const params = {
                        ...this.searchParams,
                        export: true
                    };
                    
                    // 清理空参数
                    Object.keys(params).forEach(key => {
                        if (params[key] === '' || params[key] === null || params[key] === undefined) {
                            delete params[key];
                        }
                    });
                    
                    // 构建查询字符串
                    const queryString = Object.keys(params)
                        .map(key => `${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`)
                        .join('&');
                    
                    // 创建导出URL
                    const exportUrl = `https://ht.bbbyg.vip/api/admin/points/orders/export?${queryString}`;
                    
                    // 在新窗口打开导出链接
                    window.open(exportUrl, '_blank');
                },
                
                // 分页大小改变
                handleSizeChange(val) {
                    this.pageSize = val;
                    this.loadOrders();
                },
                
                // 页码改变
                handleCurrentChange(val) {
                    this.currentPage = val;
                    this.loadOrders();
                },
                
                // 发货订单
                shipOrder(order) {
                    this.$confirm(`确定要将订单 ${order.order_number} 标记为已发货吗？`, '确认发货', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(async () => {
                        try {
                            const response = await axios.put(`https://ht.bbbyg.vip/api/admin/points/order/${order.id}/ship`);
                            
                            if (response.data.success) {
                                this.$message.success('发货成功');
                                // 重新加载订单列表
                                this.loadOrders();
                            } else {
                                this.$message.error(response.data.error || '发货失败');
                            }
                        } catch (error) {
                            console.error('发货失败:', error);
                            this.$message.error('发货失败');
                        }
                    }).catch(() => {});
                }
            }
        });
    </script>
</body>
</html>
